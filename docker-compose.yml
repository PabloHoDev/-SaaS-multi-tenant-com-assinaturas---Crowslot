services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crowslot
      POSTGRES_PASSWORD: crowslot
      POSTGRES_DB: crowslot
    ports:
      # Só a própria máquina acessa: a senha acima é de desenvolvimento.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
